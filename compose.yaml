name: emustack-0.7.1

x-container-logging: &emustack-bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-build: &emustack-build
  context: .
  args:
    DEBIAN_BASE_IMAGE: "${DEBIAN_BASE_IMAGE:-debian:trixie-slim@sha256:89c1ea91e897f0fe0a3731595330bc45b8bdef4047464a07116f891a94054b31}"
    APT_SNAPSHOT_TIMESTAMP: ${APT_SNAPSHOT_TIMESTAMP:-}
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    BUILD_KYTYPS5: ${BUILD_KYTYPS5:-1}
    KYTYPS5_REF: ${KYTYPS5_REF:-KytyPS5-2026-10-26-f90a8b1}
    KYTYPS5_EXPECTED_SHORT: ${KYTYPS5_EXPECTED_SHORT:-f90a8b1}
    INSTALL_UPSTREAM: ${INSTALL_UPSTREAM:-1}

x-agent-environment: &agent-environment
  HOME: /home/emu
  XDG_CONFIG_HOME: /home/emu/.config
  XDG_CACHE_HOME: /home/emu/.cache
  EMUSTACK_BIN_DIR: /opt/emustack/installed
  EMUSTACK_USER_BIN_DIR: /custom-emulators
  EMUSTACK_INSTALL_REPORT: /opt/emustack/install-report.json
  EMUSTACK_SYSTEMS_PATH: /opt/emustack/console-systems.json
  EMUSTACK_ENVIRONMENTS_PATH: /opt/emustack/environments.json
  EMUSTACK_GAMES_DIR: /games
  EMUSTACK_BIOS_DIR: /bios
  EMUSTACK_SAVES_DIR: /saves
  EMUSTACK_LOG_DIR: /home/emu/.local/state/emustack/logs
  EMUSTACK_CEMU_MLC_PATH: /home/emu/.local/share/Cemu/mlc01
  EMUSTACK_XEMU_CONFIG: /home/emu/.config/xemu/xemu.toml
  EMUSTACK_AGENT_PORT: "8877"
  EMUSTACK_MAX_ACTIVE_PER_ENV: ${EMUSTACK_MAX_ACTIVE_PER_ENV:-2}
  WINEDLLOVERRIDES: "mscoree,mshtml="

x-agent-common: &agent-common
  image: local/emustack:0.7.1
  build: *emustack-build
  init: true
  restart: unless-stopped
  logging: *emustack-bounded-logging
  cpus: ${EMUSTACK_ENV_CPU_LIMIT:-6}
  mem_limit: ${EMUSTACK_ENV_MEMORY_LIMIT:-5g}
  pids_limit: ${EMUSTACK_ENV_PIDS_LIMIT:-512}
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=2g
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8877/health', timeout=2).read()"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  # CLI is intentionally data-blind; it inventories the common read-only image only.
  emustack:
    image: local/emustack:0.7.1
    build: *emustack-build
    init: true
    cpus: ${EMUSTACK_CLI_CPU_LIMIT:-2}
    logging: *emustack-bounded-logging
    mem_limit: ${EMUSTACK_CLI_MEMORY_LIMIT:-2g}
    pids_limit: ${EMUSTACK_CLI_PIDS_LIMIT:-128}
    environment:
      HOME: /home/emu
      EMUSTACK_GAMES_DIR: /games
      EMUSTACK_BIN_DIR: /opt/emustack/installed
      EMUSTACK_USER_BIN_DIR: /custom-emulators
      EMUSTACK_INSTALL_REPORT: /opt/emustack/install-report.json
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [management]
    command: ["list"]

  env-kytyps5:
    <<: *agent-common
    environment:
      <<: *agent-environment
      EMUSTACK_ENV_ID: kytyps5
      EMUSTACK_AGENT_TOKEN: ${EMUSTACK_AGENT_TOKEN_KYTYPS5:-}
    volumes:
      - ./data/environments/kytyps5/games:/games:ro
      - ./data/environments/kytyps5/bios:/bios:ro
      - ./data/environments/kytyps5/saves:/saves:rw
      - ./data/environments/kytyps5/home:/home/emu:rw
      - ./data/environments/kytyps5/emulators:/custom-emulators:ro
    networks:
      env-kytyps5-net:
        ipv4_address: 172.28.1.2
    entrypoint: ["python3", "/opt/emustack/console_agent.py"]
    command: []

  env-duckstation:

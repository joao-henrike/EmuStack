worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # The container root is read-only; keep every Nginx scratch path on tmpfs.
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8765;
        server_name _;
        client_max_body_size 16k;

        location / {
            proxy_pass http://dashboard:8765;
            proxy_http_version 1.1;

            # Preserve the browser's same-origin contract. The dashboard trusts
            # the proxy's TCP source IP, never X-Forwarded-For or other client headers.
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-EmuStack-Request $http_x_emustack_request;
            proxy_set_header Connection "";

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}

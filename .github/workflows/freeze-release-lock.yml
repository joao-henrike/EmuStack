name: Freeze official emulator release assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emustack-release-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install manifest validation helper
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate source and scripts
        run: bash scripts/validate-project.sh
      - name: Prepare isolated data directories and local secrets
        run: bash scripts/host-setup.sh
      - name: Enter discovery mode for the first build
        run: |
          cat > release-lock.json <<'JSON'
          {
            "schema_version": 1,
            "strict": false,
            "items": {}
          }
          JSON
      - name: Build image and install official upstream assets
        run: docker compose -f compose.yaml build --build-arg BUILD_KYTYPS5=0
      - name: Export strict lock from assets actually installed
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -f compose.yaml run --rm --no-deps emustack export-lock > release-lock.json.candidate
          python scripts/check-release-lock.py release-lock.json.candidate --require-strict --require-pins
          mv release-lock.json.candidate release-lock.json
      - name: Rebuild image using only pinned upstream assets
        run: docker compose -f compose.yaml build --build-arg BUILD_KYTYPS5=0
      - name: Validate strict lock coverage and hashes
        run: python scripts/check-release-lock.py release-lock.json --require-strict --require-pins
      - name: Upload verified release-lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: emustack-release-lock-${{ github.sha }}
          path: release-lock.json
          if-no-files-found: error
          retention-days: 14

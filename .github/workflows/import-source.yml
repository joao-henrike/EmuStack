name: Import complete EmuStack source archive

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

concurrency:
  group: emustack-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the verified staging commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Reconstruct, verify and import source
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='3753467d99c7ef1e73cce9d1fc0262b60a2a95bc83804994ea35b1b66ce97771'
          [[ "$(tr -d '\r\n' < .bootstrap/READY)" == "$expected" ]]

          archive="$RUNNER_TEMP/EmuStack-Docker-0.7.1.zip"
          cat .bootstrap/chunk-*.b64 | base64 --decode > "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -

          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$archive" -d "$RUNNER_TEMP/unpacked"
          src="$RUNNER_TEMP/unpacked/EmuStack-0.7.1"
          [[ -f "$src/README.md" && -f "$src/Dockerfile" && -f "$src/compose.yaml" && -f "$src/emustack.py" && -f "$src/game-sources.json" && -d "$src/scripts" && -d "$src/tests" && -d "$src/web" ]]

          # Never import Python bytecode or local/user-owned data.
          find "$src" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$src" -type f -name '*.pyc' -delete
          if find "$src" -type f \( -name '.env' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Secret or private key file found; aborting.' >&2
            exit 1
          fi
          for rel in data/games data/bios data/home data/saves data/config data/environments emulators; do
            if [[ -d "$src/$rel" ]]; then
              extra="$(find "$src/$rel" -type f ! -name '.gitkeep' -print -quit)"
              if [[ -n "$extra" ]]; then
                echo "User data detected at $rel; aborting." >&2
                exit 1
              fi
            fi
          done

          cp -a "$src/." "$GITHUB_WORKSPACE/"
          rm -rf .bootstrap
          rm -f IMPORT-LOCAL.sh
          rm -rf .github/workflows/import-source.yml
          rmdir .github/workflows .github 2>/dev/null || true
          find scripts -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete EmuStack 0.7.1 source tree'
          git push origin HEAD:main

      - name: Verify expected source tree landed
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in Dockerfile compose.yaml emustack.py web scripts tests docs/game-sources.md; do
            if [[ ! -e "$path" ]]; then
              echo "Missing expected source path after import: $path" >&2
              exit 1
            fi
          done
          git status --short

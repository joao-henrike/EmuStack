name: Import verified EmuStack source bundle

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.head_commit.message == 'chore: mark verified source bundle ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify, unpack, and import full source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='3753467d99c7ef1e73cce9d1fc0262b60a2a95bc83804994ea35b1b66ce97771'
          [[ "$(tr -d '\r\n' < .bootstrap/READY)" == "$expected" ]]
          archive="$RUNNER_TEMP/EmuStack-Docker-0.7.1.zip"
          cat .bootstrap/chunk-*.b64 | base64 --decode > "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$archive" -d "$RUNNER_TEMP/unpacked"
          src="$RUNNER_TEMP/unpacked/EmuStack-0.7.1"
          [[ -f "$src/README.md" && -f "$src/Dockerfile" && -f "$src/compose.yaml" && -f "$src/emustack.py" && -f "$src/game-sources.json" && -d "$src/scripts" && -d "$src/tests" && -d "$src/web" ]]
          if find "$src" -type f \( -name '.env' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Secret/key file found; aborting.' >&2; exit 1
          fi
          for rel in data/games data/bios data/home data/saves data/config data/environments emulators; do
            if [[ -d "$src/$rel" ]]; then
              extra="$(find "$src/$rel" -type f ! -name '.gitkeep' -print -quit)"
              if [[ -n "$extra" ]]; then echo "User data detected at $rel; aborting." >&2; exit 1; fi
            fi
          done
          cp -a "$src/." "$GITHUB_WORKSPACE/"
          rm -rf .bootstrap
          rm -f IMPORT-LOCAL.sh
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete EmuStack 0.7.1 project source'
          git push origin HEAD:main
      - name: Report import result
        if: always()
        run: echo "Inspect the workflow run and main source tree."

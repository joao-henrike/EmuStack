name: EmuStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emustack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install manifest validation helper
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate source, Python tests, JavaScript tests and shell syntax
        run: bash scripts/validate-project.sh
      - name: Validate strict official release lock
        run: python scripts/check-release-lock.py --require-strict --require-pins
      - name: Parse Compose manifests and compare catalog IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          root = Path(".")
          for name in ("compose.yaml", "compose.nvidia.yaml"):
              data = yaml.safe_load((root / name).read_text())
              assert isinstance(data, dict) and isinstance(data.get("services"), dict), name
              print(f"{name}: {len(data['services'])} services parsed")
          envs = json.loads((root / "environments.json").read_text())["environments"]
          catalog = json.loads((root / "catalog.json").read_text())["emulators"]
          ids = [x["id"] for x in envs]
          cids = [x["id"] for x in catalog]
          assert len(ids) == 20 and len(set(ids)) == 20, "environment IDs invalid"
          assert set(ids) == set(cids), "catalog/environment IDs differ"
          print(f"catalog/environments: {len(ids)} matching IDs")
          compose = yaml.safe_load((root / "compose.yaml").read_text())
          dashboard = compose["services"]["dashboard"]
          trusted = set(dashboard["environment"]["EMUSTACK_CONTROL_TRUSTED_CLIENT_IPS"].split(","))
          expected_gateways = set()
          assert len(ids) == 20
          for index, env_id in enumerate(ids, 1):
              network_name = f"env-{env_id}-net"
              service = compose["services"][f"env-{env_id}"]
              network = compose["networks"][network_name]
              assert service["networks"][network_name]["ipv4_address"] == f"172.28.{index}.2", env_id
              assert dashboard["networks"][network_name]["ipv4_address"] == f"172.28.{index}.3", env_id
              ipam = network["ipam"]["config"][0]
              assert ipam["subnet"] == f"172.28.{index}.0/24", env_id
              assert ipam["gateway"] == f"172.28.{index}.1", env_id
              assert network.get("internal") is True, env_id
              expected_gateways.add(f"172.28.{index}.1")
          assert trusted == expected_gateways, "control client allowlist must match isolated network gateways"
          print("dashboard/agent source-address boundary: 20 isolated static networks validated")
          PY
      - name: Prepare isolated runtime secrets and directories
        env:
          # GitHub hosted runners expose only two CPUs; keep test containers within that per-container ceiling.
          EMUSTACK_CPU_LIMIT: "0.50"
          EMUSTACK_MEMORY_LIMIT: "768m"
          EMUSTACK_PIDS_LIMIT: "128"
          EMUSTACK_ENV_CPU_LIMIT: "0.25"
          EMUSTACK_ENV_MEMORY_LIMIT: "512m"
          EMUSTACK_ENV_PIDS_LIMIT: "128"
        run: bash scripts/host-setup.sh
      - name: Validate Docker Compose merged configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
      - name: Build runtime image without optional upstream downloads
        run: docker compose -f compose.yaml build --build-arg BUILD_KYTYPS5=0 --build-arg INSTALL_UPSTREAM=0 dashboard
      - name: Generate pinned SPDX SBOM and scan HIGH/CRITICAL vulnerabilities
        env:
          EMUSTACK_SECURITY_ARTIFACTS_DIR: artifacts
        run: bash scripts/supply-chain-scan.sh
      - name: Start isolated agents and dashboard
        run: docker compose -f compose.yaml up -d --no-build dashboard
      - name: Run Docker runtime acceptance and inter-agent boundary probes
        env:
          EMUSTACK_RUN_RECOVERY_TESTS: "1"
        run: ./scripts/runtime-acceptance.sh
      - name: Show service logs if a preceding runtime step failed
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=200 || true
      - name: Stop isolated runtime
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans || true
      - name: Check browser asset contracts
        run: |
          test -s web/index.html
          test -s web/app.css
          test -s web/app.js
          test -s web/launch-utils.js
          grep -q 'id="view-consoles"' web/index.html
          grep -q 'id="console-system-grid"' web/index.html
          grep -q 'renderConsoleSystems' web/app.js
          grep -q 'recommendEmulatorForGame(gamePath)' web/app.js
          git diff --check
      - name: Generate CI validation report
        if: always()
        env:
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          mkdir -p artifacts
          cat > artifacts/validation-report.md <<EOF
          # EmuStack CI validation report

          - Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - Commit SHA: ${GITHUB_SHA}
          - Job status before artifact upload: ${VALIDATION_RESULT}
          - Upstream install flag: INSTALL_UPSTREAM=0 (disabled)
          - Experimental KytyPS5 build flag: BUILD_KYTYPS5=0 (disabled)
          - Host coverage: GitHub-hosted runner only; physical GPU/host performance is not verified.
          - Compatibility boundary: this run does not certify BIOS/firmware, original-console boot, individual-game compatibility or gameplay on physical hardware.
          EOF
          cat artifacts/validation-report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -s artifacts/supply-chain-summary.md ]]; then cat artifacts/supply-chain-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload CI validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emustack-validation-report-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
